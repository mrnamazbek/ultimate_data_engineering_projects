default:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'deuser') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'depassword') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dedb') }}"
      schema: public
      threads: 2
