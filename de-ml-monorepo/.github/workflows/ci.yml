name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install ruff black

      - name: ruff check
        run: ruff check de-ml-monorepo/

      - name: black check
        run: black --check de-ml-monorepo/

  test-project1:
    name: Project 1 – unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest kafka-python pyspark==3.5.1
          pip install -r de-ml-monorepo/projects/project1-kafka-spark/requirements.txt

      - name: Run tests
        run: pytest de-ml-monorepo/projects/project1-kafka-spark/tests/ -v --ignore=de-ml-monorepo/projects/project1-kafka-spark/tests/test_integration_smoke.py

  test-project2:
    name: Project 2 – unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest apache-airflow==2.9.1 --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.1/constraints-3.10.txt"

      - name: Run tests
        run: pytest de-ml-monorepo/projects/project2-dw-dbt-airflow/tests/test_dag.py -v

  test-project3:
    name: Project 3 – unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r de-ml-monorepo/projects/project3-ml-deploy/requirements.txt

      - name: Run tests
        run: pytest de-ml-monorepo/projects/project3-ml-deploy/tests/ -v

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kafka-producer image
        run: docker build -t kafka-producer:ci de-ml-monorepo/projects/project1-kafka-spark/services/kafka_producer/

      - name: Build spark-job image
        run: docker build -t spark-job:ci de-ml-monorepo/projects/project1-kafka-spark/spark_job/

      - name: Build dbt-runner image
        run: docker build -t dbt-runner:ci de-ml-monorepo/projects/project2-dw-dbt-airflow/dbt_project/

      - name: Build trainer image
        run: docker build -t trainer:ci de-ml-monorepo/projects/project3-ml-deploy/trainer/

      - name: Build model-api image
        run: docker build -t model-api:ci de-ml-monorepo/projects/project3-ml-deploy/app/

  smoke-integration:
    name: Smoke integration tests
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure services
        run: |
          cd de-ml-monorepo
          docker compose up -d postgres kafka minio zookeeper
          sleep 30

      - name: Wait for Postgres
        run: |
          until docker compose -f de-ml-monorepo/docker-compose.yml exec -T postgres pg_isready -U deuser; do
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install smoke test deps
        run: pip install psycopg2-binary kafka-python

      - name: Run model-api smoke test
        run: |
          # Build and start model-api with trainer
          cd de-ml-monorepo
          docker compose run --rm trainer || true
          docker compose up -d model-api
          sleep 10
          curl --retry 5 --retry-delay 3 -f http://localhost:8000/health

      - name: Tear down
        if: always()
        run: docker compose -f de-ml-monorepo/docker-compose.yml down -v
